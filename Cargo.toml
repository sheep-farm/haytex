[package]
name = "haytex"
version = "0.2.2"
edition = "2021"
description = "LaTeX snippet generator plugin for Hayashi — publication-ready tables and equations"
license = "MIT"
repository = "https://github.com/sheep-farm/haytex"
keywords = ["hayashi", "latex", "econometrics", "tables", "plugin"]

[lib]
crate-type = ["cdylib"]

[dependencies]
hayashi-plugin-sdk = { path = "/home/flavop/GitHub/hayashi-plugin-sdk/sdk" }

[profile.release]
opt-level = 3
lto = true
strip = "symbols"
panic = "abort"
